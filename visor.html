<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ManinaCam - Visor</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #000; height: 100%;
    font-family: Arial, sans-serif; overflow: hidden;
  }
  #video {
    width: 100%; height: 100%; object-fit: contain;
    background: #000;
  }
  #setup {
    position: fixed; inset: 0; background: #111;
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; padding: 24px; box-sizing: border-box;
  }
  #setup h1 { color: #4fc3f7; margin-bottom: 4px; }
  #setup p { color: #9e9e9e; margin-top: 0; margin-bottom: 24px; text-align: center; }
  #roomInput {
    width: 100%; max-width: 320px; padding: 14px; font-size: 16px;
    border-radius: 8px; border: 1px solid #444; background: #222;
    color: white; margin-bottom: 16px; box-sizing: border-box;
  }
  #connectBtn {
    width: 100%; max-width: 320px; padding: 16px; font-size: 16px;
    border-radius: 8px; border: none; background: #1976D2; color: white;
    cursor: pointer;
  }
  #connectBtn:active { background: #1565C0; }
  #status {
    position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,0.6);
    color: white; padding: 8px 14px; border-radius: 8px; font-size: 14px;
    display: none;
  }
</style>
</head>
<body>

<div id="setup">
  <h1>ManinaCam</h1>
  <p>Modo Visor — ver la transmisión<br>de la cámara</p>
  <input id="roomInput" type="text" placeholder="Código de sala (ej: casa123)">
  <button id="connectBtn">Conectar</button>
</div>

<video id="video" autoplay playsinline></video>
<div id="status"></div>

<script>
// ==== CONFIGURACIÓN (debe coincidir con camara.html) ====
const FIREBASE_URL = "https://lool-3bde4-default-rtdb.firebaseio.com";
const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
  { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
];
// ==========================================================

const setupEl = document.getElementById('setup');
const videoEl = document.getElementById('video');
const statusEl = document.getElementById('status');
const roomInput = document.getElementById('roomInput');
const connectBtn = document.getElementById('connectBtn');

let roomId = "";
let pc = null;
let pollTimer = null;
let candidateIndex = 0;
let answered = false;

function showStatus(text) {
  statusEl.style.display = 'block';
  statusEl.innerText = text;
}

function fbUrl(path) {
  return `${FIREBASE_URL}/rooms/${roomId}/${path}.json`;
}

async function fbPut(path, data) {
  await fetch(fbUrl(path), { method: 'PUT', body: JSON.stringify(data) });
}

async function fbGet(path) {
  const res = await fetch(fbUrl(path));
  const text = await res.text();
  if (!text || text === 'null') return null;
  try { return JSON.parse(text); } catch { return null; }
}

async function connect() {
  roomId = roomInput.value.trim();
  if (!roomId) { alert("Escribe el código de sala"); return; }

  setupEl.style.display = 'none';
  showStatus("Buscando la cámara...");

  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  pc.ontrack = (event) => {
    videoEl.srcObject = event.streams[0];
    showStatus("Conectado");
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      fbPut(`calleeCandidates/${candidateIndex++}`, event.candidate.toJSON());
    }
  };

  pc.oniceconnectionstatechange = () => {
    showStatus("Estado: " + pc.iceConnectionState);
  };

  pollTimer = setInterval(async () => {
    if (!answered) {
      const offer = await fbGet("offer");
      if (offer) {
        answered = true;
        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await fbPut("answer", { type: answer.type, sdp: answer.sdp });
        showStatus("Conectando video...");
      }
    }
    const candidates = await fbGet("callerCandidates");
    if (candidates) {
      for (const key in candidates) {
        try { await pc.addIceCandidate(new RTCIceCandidate(candidates[key])); } catch (e) {}
      }
    }
  }, 2000);
}

connectBtn.addEventListener('click', connect);

// Si la URL trae ?room=algo, conecta directo sin pedir nada.
const params = new URLSearchParams(window.location.search);
const roomFromUrl = params.get('room');
if (roomFromUrl) {
  roomInput.value = roomFromUrl;
  connect();
}
</script>

</body>
</html>
