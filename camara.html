<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ManinaCam - Cámara</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #000; height: 100%;
    font-family: Arial, sans-serif; overflow: hidden;
  }
  #video {
    width: 100%; height: 100%; object-fit: cover;
    background: #111;
  }
  #setup {
    position: fixed; inset: 0; background: #111;
    display: flex; flex-direction: column; justify-content: center;
    align-items: center; padding: 24px; box-sizing: border-box;
  }
  #setup h1 { color: #4fc3f7; margin-bottom: 4px; }
  #setup p { color: #9e9e9e; margin-top: 0; margin-bottom: 24px; text-align: center; }
  #roomInput {
    width: 100%; max-width: 320px; padding: 14px; font-size: 16px;
    border-radius: 8px; border: 1px solid #444; background: #222;
    color: white; margin-bottom: 16px; box-sizing: border-box;
  }
  #startBtn {
    width: 100%; max-width: 320px; padding: 16px; font-size: 16px;
    border-radius: 8px; border: none; background: #1976D2; color: white;
    cursor: pointer;
  }
  #startBtn:active { background: #1565C0; }
  #status {
    position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,0.6);
    color: white; padding: 8px 14px; border-radius: 8px; font-size: 14px;
    display: none;
  }
  #debugLog {
    position: fixed; bottom: 0; left: 0; right: 0; max-height: 40%;
    overflow-y: auto; background: rgba(0,0,0,0.75); color: #0f0;
    font-family: monospace; font-size: 11px; padding: 6px 8px;
    box-sizing: border-box; z-index: 1000; white-space: pre-wrap;
  }
</style>
</head>
<body>

<div id="setup">
  <h1>ManinaCam</h1>
  <p>Modo Cámara — deja esta tablet apuntando<br>a lo que quieres vigilar</p>
  <input id="roomInput" type="text" placeholder="Código de sala (ej: casa123)">
  <button id="startBtn">Iniciar transmisión</button>
</div>

<video id="video" autoplay playsinline muted></video>
<div id="status"></div>
<div id="debugLog"></div>

<script>
// ==== CONFIGURACIÓN ====
const FIREBASE_URL = "https://lool-3bde4-default-rtdb.firebaseio.com";
const ICE_SERVERS = [
  { urls: "stun:stun.l.google.com:19302" },
  { urls: "turn:free.expressturn.com:3478?transport=udp", username: "000000002104118924", credential: "cKaEwsVIfFmadH32WP9CCNdpPBw=" },
  { urls: "turn:free.expressturn.com:3478?transport=tcp", username: "000000002104118924", credential: "cKaEwsVIfFmadH32WP9CCNdpPBw=" }
];
const VIDEO_CONSTRAINTS = {
  video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15 }, facingMode: "environment" },
  audio: true
};
// ========================

const setupEl = document.getElementById('setup');
const videoEl = document.getElementById('video');
const statusEl = document.getElementById('status');
const roomInput = document.getElementById('roomInput');
const startBtn = document.getElementById('startBtn');
const debugLog = document.getElementById('debugLog');

function log(msg) {
  const line = document.createElement('div');
  line.textContent = new Date().toLocaleTimeString() + ' — ' + msg;
  debugLog.appendChild(line);
  debugLog.scrollTop = debugLog.scrollHeight;
  while (debugLog.children.length > 40) debugLog.removeChild(debugLog.firstChild);
}

let roomId = "";
let pc = null;
let pollTimer = null;
let candidateIndex = 0;
let reconnectScheduled = false;

function scheduleReconnect() {
  if (reconnectScheduled) return;
  reconnectScheduled = true;
  const params = new URLSearchParams(window.location.search);
  if (!params.get('room')) {
    log('Conexión perdida. Vuelve a tocar "Iniciar transmisión".');
    return;
  }
  log('Conexión perdida, reintentando en 5s...');
  showStatus("Reconectando...");
  setTimeout(() => location.reload(), 5000);
}

function showStatus(text) {
  statusEl.style.display = 'block';
  statusEl.innerText = text;
}

function fbUrl(path) {
  return `${FIREBASE_URL}/rooms/${roomId}/${path}.json`;
}

async function fbPut(path, data) {
  await fetch(fbUrl(path), { method: 'PUT', body: JSON.stringify(data) });
}

async function fbGet(path) {
  const res = await fetch(fbUrl(path));
  const text = await res.text();
  if (!text || text === 'null') return null;
  try { return JSON.parse(text); } catch { return null; }
}

async function fbDelete(path) {
  await fetch(`${FIREBASE_URL}/rooms/${roomId}${path ? '/' + path : ''}.json`, { method: 'DELETE' });
}

async function startStreaming() {
  roomId = roomInput.value.trim();
  if (!roomId) { alert("Escribe un código de sala"); return; }

  setupEl.style.display = 'none';
  showStatus("Pidiendo permiso de cámara...");

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia(VIDEO_CONSTRAINTS);
  } catch (e) {
    showStatus("Error al abrir la cámara: " + e.message);
    setupEl.style.display = 'flex';
    return;
  }

  videoEl.srcObject = stream;
  const vt = stream.getVideoTracks()[0];
  const at = stream.getAudioTracks()[0];
  log(`getUserMedia OK. video: ${vt ? vt.label + ' ' + JSON.stringify(vt.getSettings()) : 'NINGUNO'}`);
  log(`audio: ${at ? at.label : 'ninguno'}`);
  showStatus("Limpiando sala...");
  await fbDelete("");

  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  stream.getTracks().forEach(track => {
    pc.addTrack(track, stream);
    log(`addTrack: ${track.kind} readyState=${track.readyState}`);
  });

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      fbPut(`callerCandidates/${candidateIndex++}`, event.candidate.toJSON());
    }
  };

  pc.oniceconnectionstatechange = () => {
    showStatus("Estado: " + pc.iceConnectionState);
    log('ICE state: ' + pc.iceConnectionState);
    if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
      scheduleReconnect();
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await fbPut("offer", { type: offer.type, sdp: offer.sdp });
  showStatus("Esperando visor...");

  let answered = false;
  pollTimer = setInterval(async () => {
    if (!answered) {
      const answer = await fbGet("answer");
      if (answer) {
        answered = true;
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
        showStatus("Visor conectado");
      }
    }
    const candidates = await fbGet("calleeCandidates");
    if (candidates) {
      for (const key in candidates) {
        try { await pc.addIceCandidate(new RTCIceCandidate(candidates[key])); } catch (e) {}
      }
    }
  }, 2000);

  // Evita que la pantalla se apague mientras transmite (si el navegador lo soporta)
  try {
    if ('wakeLock' in navigator) {
      await navigator.wakeLock.request('screen');
    }
  } catch (e) {}
}

startBtn.addEventListener('click', startStreaming);

// Si la URL trae ?room=algo, lo llenamos y arrancamos solo, sin pedir nada.
const params = new URLSearchParams(window.location.search);
const roomFromUrl = params.get('room');
if (roomFromUrl) {
  roomInput.value = roomFromUrl;
  startStreaming();
}
</script>

</body>
</html>
